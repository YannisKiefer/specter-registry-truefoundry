id: NVIDIA-skills-doca-verbs
display_name: doca-verbs
description: 'Raw verbs inside DOCA Core (doca-verbs): direct control of QP, CQ, PD,
  SRQ and address-handle objects through doca_verbs_context, doca_verbs_qp_create
  / doca_verbs_qp_modify and doca_verbs_cq_create, porting libibverbs code into DOCA
  Core, or a QP attribute, opcode or WR flag the doca-rdma task API does not expose.
  Trigger on "raw QP attribute the task API does not expose", "porting libibverbs
  code", "IO_FAILED on WR submit", "QP state transition rejected", or "attach a congestion-control
  group", even without naming doca-verbs. Its first job is to route MOST users back
  up to doca-rdma, doca-eth or doca-rmax. Covers CC-group and Ethernet SQ/RQ primitives,
  capability queries via doca_verbs_query_device, and DOCA_ERROR_* from doca_verbs_*
  calls. Refuse and route elsewhere for ordinary doca-rdma / doca-eth / doca-rmax
  workloads, DOCA install, Core internals, and general libibverbs theory.'
