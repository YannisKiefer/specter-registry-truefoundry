id: NVIDIA-skills-ethos-orchestrate
display_name: ethos-orchestrate
description: 'Entry point for an AI agent''s ethos.md: a durable snapshot of what
  the agent is for, what it must not do, and what success looks like. Routes a request
  to explore and capture intent (ethos-explore), or write or edit the file (ethos-write),
  including renaming an Eval Author 0.1.0 ETHOS.md. Owns the standard every ethos
  sub-flow follows. Use when the user asks "help me write an ethos.md", "does my agent
  have an ethos.md?", "update my agent''s ethos.md", or when you need to pick between
  the ethos sub-flows.'
