id: NVIDIA-skills-doca-rmax
display_name: doca-rmax
description: DOCA Rivermax (doca_rmax) receive streams for timing-precise media over
  IP (SMPTE ST 2110 video / audio, market data, scientific feeds) on a BlueField DPU
  or ConnectX host, once the Rivermax SDK and its license are installed; getting the
  SDK or license is doca-setup / doca-public-knowledge-map territory. Trigger on "ST
  2110 receive isn't getting frames", "sub-microsecond jitter on my media receiver",
  "NOT_SUPPORTED from doca_rmax_init", "no recv events after stream start", or "license
  check failing on a media receiver", even without naming Rivermax. Covers doca_rmax_in_stream
  sessions, the SDK + license precondition check, doca_rmax_get_*_supported capability
  queries, pairing with doca-eth queues and doca-flow steering, and DOCA_ERROR_* from
  Rivermax calls. Refuse and route elsewhere for programming the underlying queue
  (doca-eth), steering rules (doca-flow), PTP / clock sync (doca-firefly), or best-effort
  packet I/O.
